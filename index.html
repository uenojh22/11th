<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>上野中学22回生第11回同窓会</title>
  
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="images/favicon.png"> 
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; padding: 0; background-color: #EFEDEB; font-family: sans-serif; }
    .header-banner {
      width: 100%; height: 160px; background: #001f3f url("images/back.png") no-repeat center center;
      background-size: cover; display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }
    .header-banner h1 {
      margin: 0; font-family: "Impact", sans-serif; font-size: 34px; letter-spacing: 2px;
      line-height: 1.2; font-weight: 900; -webkit-text-stroke: 1px rgba(255,255,255,0.1);
    }
    .logo-container { margin-top: 10px; text-align: center; position: relative; z-index: 10; }
    .logo-container img { width: 150px; height: auto; }
    .main-content { max-width: 600px; margin: 10px auto; padding: 20px; text-align: center; }
    .instruction-text { color: #103C59; font-weight: bold; font-size: 16px; margin-bottom: 20px; }
    #pass { width: 100%; max-width: 300px; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; box-sizing: border-box; }
    .check-btn { background-color: #103C59; color: white; padding: 14px 28px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 18px; transition: 0.2s; }
    .check-btn:disabled { background-color: #666; cursor: not-allowed; }
    .error-box { margin: 20px auto; width: 100%; max-width: 450px; padding: 10px; background-color: #fdeaea; color: #d93025; font-weight: bold; border-radius: 4px; display: none; }
    .footer { margin-top: 150px; text-align: right; font-size: 10px; color: #777; padding-right: 20px; }
  </style>
</head>
<body>

  <div class="header-banner">
    <h1>上野中学22回生</h1>
    <h1>第11回同窓会</h1>
  </div>

  <div class="logo-container">
    <img src="images/logo.png" alt="校章">
  </div>

  <div class="main-content">
    <form id="loginForm">
      <div id="authBox">
        <div class="instruction-text">パスワードを入力してください</div>
        <input type="password" id="pass" placeholder="パスワードを入力" required>
        <br>
        <button type="submit" id="loginBtn" class="check-btn">認証する</button>
        <p id="err" class="error-box">パスワードが正しくありません</p>
      </div>
    </form>

    <div class="footer">
      (C)2026 神戸市立上野中学22回生同窓会事務局
    </div>
  </div>

  <script>
    // GASのURL
    const gasUrl = "https://script.google.com/macros/s/AKfycbwzyCLkjxsQv0QLkHLgOLERKQf-1Dox16361ZvcW5BVh_8v2tuoZAkgaFlvtZdLHSjj/exec"; 

    const loginForm = document.getElementById("loginForm");
    const passInput = document.getElementById("pass");
    const loginBtn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("err");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pass = passInput.value;
      if (!pass) return;

      errorBox.style.display = "none";
      loginBtn.disabled = true;
      loginBtn.innerText = "認証中...";

      try {
        const response = await fetch(gasUrl, {
          method: "POST",
          body: JSON.stringify({ "password": pass })
        });
        const result = await response.json();

        // GASから認証成功フラグとURLを受け取って遷移
        if (result.auth && result.url) {
          loginBtn.innerText = "認証成功！移動します...";
          try {
            window.top.location.replace(result.url);
          } catch (error) {
            window.location.replace(result.url);
          }
        } else {
          errorBox.style.display = "block";
          passInput.value = ""; 
          passInput.focus();     
          loginBtn.disabled = false;
          loginBtn.innerText = "認証する";
        }
      } catch (e) {
        alert("通信エラーが発生しました。");
        loginBtn.disabled = false;
        loginBtn.innerText = "認証する";
      }
    });
  </script>
</body>
</html>
